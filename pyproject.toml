[project]
name = "file-bridge"
# The real runtime version is injected via the APP_VERSION env var
# (git tag -> CI build-arg -> Dockerfile ARG/ENV). package=false means
# this field is never consumed at runtime; it exists solely to satisfy
# uv's PEP 621 parser (version is mandatory when [project] is present).
version = "1.0.0"

requires-python = ">=3.14"
dependencies = [
    "dingtalk-stream>=0.24.3",
    "fastembed>=0.8.1",
    "httpx>=0.27.0",
    "pillow>=12.0.0",
    "pymediainfo>=6.0.0",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m general"
strict_markers = true
markers = [
    "general: default test set for CI and daily runs (everything except opt-in sets; never loads the embedding model)",
    "semantic: real embedding-model acceptance tests; run explicitly with 'pytest -m semantic'",
]
