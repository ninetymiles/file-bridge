[project]
name = "file-bridge"
version = "0.1.0"
description = "DingTak chat bot backend."
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "dingtalk-stream>=0.24.3",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
