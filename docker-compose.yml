services:
  bridge:
    build: .
    image: ${IMAGE_TAG:-file-bridge:latest}
    container_name: file-bridge
    restart: unless-stopped
    volumes:
      - file-bridge-storage:/app/cache
      - ./output:/output
    env_file:
      - .env
    environment:
      OUTPUT_DIR: /output
volumes:
  file-bridge-storage: