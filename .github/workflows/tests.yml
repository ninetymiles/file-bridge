name: Python Tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install System Dependencies (osslsigncode)
        run: |
          sudo apt-get update
          sudo apt-get install -y osslsigncode

      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Install uv and Setup Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest
